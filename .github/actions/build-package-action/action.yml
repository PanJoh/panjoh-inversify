name: build-package
description: Build package
inputs:
  prod:
    requierd: true
    default: 'false'
  package-path:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - run: ${ACTION_PATH}/build.sh
      shell: bash
      env:
        PROD: ${{inputs.prod}}
        ACTION_PATH: ${{github.action_path}}
        PACKAGE_PATH: ${{inputs.package-path}}