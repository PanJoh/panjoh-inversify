name: build-inversify-socket-io
description: Build the inversify-socket-io package
inputs:
  prod:
    requierd: true
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - run: ${ACTION_PATH}/build.sh
      shell: bash
      env:
        PROD: ${{inputs.prod}}
        ACTION_PATH: ${{github.action_path}}