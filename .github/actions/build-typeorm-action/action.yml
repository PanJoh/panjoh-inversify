name: Build Typeorm
description: Build the typeorm package
inputs:
    prod:
        required: true
        default: 'false'
runs:
    using: composite
    steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version: '24'
        - run: build.sh
          shell: bash
          env:
            PROD: ${{inputs.prod}}
