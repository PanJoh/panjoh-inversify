name: build-and-upload-class-transformer
on:
    workflow_call:
            

jobs:
    build-and-upload:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
            - run: |
                npm i
                cd packages/inversify-socket-io
                npm run build
                cd ../inversify-socket-io-class-transformer
                npm run build
            - uses: actions/upload-artifact@v7
              with:
                path: packages/inversify-socket-io-class-transformer/dist
                name: dist
