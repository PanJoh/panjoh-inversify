on:
    workflow_call:
        inputs:
            package-path:
                required: true
                type: string
            artifact-name:
                required: true
                type: string

jobs:
    build-and-upload:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
            - run: |
                npm i
                cd $PACKAGE_PATH
                npm run build
              env:
                PACKAGE_PATH: ${{inputs.package-path}}
            - uses: actions/upload-artifact@v7
              with:
                name: ${{inputs.artifact-name}}
                path: "${{inputs.package-path}}/dist"
                
