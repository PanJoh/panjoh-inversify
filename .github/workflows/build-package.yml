on:
    workflow_call:
        inputs:
            package-path:
                required: true
                type: string
            artifact-name:
                required: true
                type: string

jobs:
    build-package:
        runs-on: ubuntu-latest
        steps:
            - uses: PanJoh/panjoh-inversify-actions/build-and-upload-package-action@v1
              with:
                package-path: ${{inputs.package-path}}
                artifact-name: dist
