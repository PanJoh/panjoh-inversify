on:
    workflow_call:
        inputs:
            prod:
                required: true
                type: string
                default: 'false'
            package-path:
                required: true
                type: string
            artifact-name:
                required: true
                type: string

jobs:
    build-package:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/build-package-action
              with:
                prod: ${{inputs.prod}}
                package-path: ${{inputs.package-path}}
            - uses: actions/upload-artifact@v7
              with:
                path: "${{inputs.package-path}}/dist"
                name: ${{inputs.artifact-name}}