on:
    workflow_call:
        inputs:
            package-path:
                required: true
                type: string
            artifact-name:
                required: true
                type: string

jobs:
    build-package:
        runs-on: ubuntu-latest
        steps:
            - uses: PanJoh/panjoh-inversify/.github/actions/build-and-upload-package-action@162009125db785a01d66ba42974f27d502bb091f
              with:
                package-path: ${{inputs.package-path}}
                artifact-name: dist
