name: deploy class tranformer
on:
    push:
        tags:
            - class-transformer@v*

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7
          - run: npm i
          - run: |
              cd packages/inversify-socket-io
              npm run build
          - run: |
              cd packages/inversify-socket-io-class-transformer
              npm run build
          - uses: actions/upload-artifact@v7
            with:
              path: packages/inversify-socket-io-class-transromer
              name: dist

    
    deploy:
        needs: build
        uses: PanJoh/panjoh-inversify/.github/workflows/deploy-package.yml@av1
        with:
          package-path: packages/inversify-socket-io-class-transformer
          artifact-name: dist
        secrets:
          npm-deploy-token: ${{secrets.NPM_DEPLOY_TOKEN}}

