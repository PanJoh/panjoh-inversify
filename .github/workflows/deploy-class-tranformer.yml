name: deploy class tranformer
on:
    push:
        tags:
            - class-transformer@v*

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
            - run: |
                npm i
                cd packages/inversify-socket-io
                npx tsc
                cd ../inversify-socket-io-class-transformer
                npx tsc
            - uses: actions/upload-artifact@v4
              with:
                name: dist
                path: packages/inversify-socket-io-class-transformer/dist
    
    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
                registry-url: https://registry.npmjs.org
            - uses: actions/download-artifact@v5
              with:
                name: dist
                path: packages/inversify-socket-io-class-transformer/dist
            - run: |
                cd packages/inversify-socket-io-class-transformer
                npm publish --access public
              env:
                NODE_AUTH_TOKEN: ${{secrets.NPM_DEPLOY_TOKEN}}

