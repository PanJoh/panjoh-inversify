name: deploy class tranformer
on:
    push:
        tags:
            - class-transformer@v*

jobs:
    build:
        uses: PanJoh/panjoh-inversify/.github/workflows/deploy-package.yml@av2
        with:
          package-path: packages/inversify-socket-io-class-transformer
          artifact-name: dist

    
    deploy:
        needs: build
        uses: PanJoh/panjoh-inversify/.github/workflows/deploy-package.yml@av2
        with:
          package-path: packages/inversify-socket-io-class-transformer
          artifact-name: dist
        secrets:
          npm-deploy-token: ${{secrets.NPM_DEPLOY_TOKEN}}

