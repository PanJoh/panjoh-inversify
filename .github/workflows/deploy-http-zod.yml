name: deploy http zod
on:
    push:
        tags:
            - inversify-http-zod@v*

jobs:
    build: 
        uses: PanJoh/panjoh-inversify/.github/workflows/build-and-upload-package.yml@av1
        with:
          package-path: packages/inversify-http-zod
          artifact-name: dist

    deploy:
        needs: build
        uses: PanJoh/panjoh-inversify/.github/workflows/deploy-package.yml@av1
        with:
          package-path: packages/inversify-http-zod
          artifact-name: dist
        secrets:
          npm-deploy-token: ${{secrets.NPM_DEPLOY_TOKEN}}

