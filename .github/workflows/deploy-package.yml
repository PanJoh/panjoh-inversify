on:
    workflow_call:
        inputs:
            artifact-name:
                required: true
                type: string
            package-path:
                required: true
                type: string
        secrets:
            npm-deploy-token:
                required: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v7
              with:
                name: ${{inputs.artifact-name}}
                path: "${{inputs.package-path}}/dist"
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
            - run: npm i
            - run: |
                cd $PACKAGE_PATH
                npm publish --access public
              env:
                NODE_AUTH_TOKEN: ${{secrets.npm-deploy-token}}
