name: deploy socket io
on:
    push:
        tags:
            - inversify-socket-io@v*

jobs:
    build: 
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
            - run: |
                npm i
                cd packages/inversify-socket-io
                npx tsc
            - uses: actions/upload-artifact@v4
              with:
                name: dist
                path: |
                    packages/inversify-socket-io/dist

    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v6
            - uses: actions/download-artifact@v5
              with:
                name: dist
                path: packages/inversify-socket-io/dist
            - uses: actions/setup-node@v7
              with:
                node-version: '24'
                registry-url: 'https://registry.npmjs.org'
            - run: |
                cd packages/inversify-socket-io
                npm publish --access public
              env:
                NODE_AUTH_TOKEN: ${{secrets.NPM_DEPLOY}}

