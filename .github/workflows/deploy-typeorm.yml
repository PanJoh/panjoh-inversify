name: 'deploy @panjoh-inversify/typeorm'
on:
    push:
        tags:
            - typeorm@v*

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: ./github/workflows/build-package
              with:
                prod: 'true'
                package-path: packages/inversify-typeorm
                artifact-name: dist

    deploy:
        uses: ./.github/workflows/deploy-package.yml
        with:
          artifact-name: dist
          package-path: packages/inversify-type-orm
        secrets:
          npm-deploy-token: ${{secrets.NPM_DEPLOY_TOKEN}}

