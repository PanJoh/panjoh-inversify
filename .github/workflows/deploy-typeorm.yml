name: 'deploy @panjoh-inversify/typeorm'
on:
    push:
        tags:
            - typeorm@v*

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - uses: PanJoh/panjoh-inversify/.github/actions/build-and-upload-package-action@av1
            with:
              package-path: packages/inversify-typeorm
              artifact-name: dist
              
    deploy:
        needs: build
        uses: PanJoh/panjoh-inversify/.github/workflows/deploy-package.yml@av1
        with:
          package-path: packages/inversify-typeorm
          artifact-name: dist
        secrets:
          npm-deploy-token: ${{secrets.NPM_DEPLOY_TOKEN}}

        # uses: PanJoh/panjoh-inversify/.github/workflows/deploy-package.yml@main
