name: 'deploy @panjoh-inversify/typeorm'
on:
    push:
        tags:
            - typeorm@v*

jobs:
    build:
        uses: PanJoh/panjoh-inversify/.github/workflows/build-package.yml@main
        with:
          package-path: packages/inversify-typeorm
          prod: 'true'
          artifact-name: dist

    deploy:
        uses: PanJoh/panjoh-inversify/.github/workflows/deploy-package.yml@main
        with:
          artifact-name: dist
          package-path: packages/inversify-type-orm
        secrets:
          npm-deploy-token: ${{secrets.NPM_DEPLOY_TOKEN}}
