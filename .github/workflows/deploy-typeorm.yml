name: 'deploy @panjoh-inversify/typeorm'
on:
    push:
        tags:
            - typeorm@v*

jobs:
    build:
        uses: PanJoh/panjoh-inversify/.github/workflows/build-package.yml@main
        with:
          package-path: packages/inversify-typeorm
          prod: 'true'
          artifact-name: dist

    deploy:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7
          - uses: actions/setup-node@v7
            with:
              node-version: '24'
          - uses: actions/download-artifact@v7
            with:
              name: dist
              path: packages/inversify-typeorm/dist
          - run: |
              npm publish --access public
            env:
              NODE_AUTH_TOKEN: ${{secrets.NPM_DEPLOY_TOKEN}}


