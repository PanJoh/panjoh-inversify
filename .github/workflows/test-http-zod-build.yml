name: test http zod build
description: Test building the inversify-http-zod package

on:
    workflow_dispatch:
        inputs:
            prod:
                required: true
                default: 'false'


jobs:
    build-http-zod:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/build-http-zod-action
              with:
                prod: ${{inputs.prod}}
            - run: ls packages/inversify-http-zod/dist