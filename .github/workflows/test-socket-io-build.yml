name: socket io build test
on:
    workflow_dispatch:
        inputs:
            prod:
                required: true
                default: 'false'

jobs:
    build-socket-io:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/build-package-action
              with:
                prod: ${{inputs.prod}}
                package-path: packages/inversify-socket-io
            - run: ls packages/inversify-socket-io/dist
            